<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: sans-serif; padding: 16px; max-width: 640px; }
textarea { width: 100%; font-size: 16px; padding: 12px; box-sizing: border-box; }
button { font-size: 18px; padding: 12px 16px; margin: 8px 8px 8px 0; }
#out { font-size: 16px; line-height: 1.4; margin-top: 16px; white-space: pre-wrap; }
.warn { font-size: 14px; }
</style>
</head>
<body>
<p class="warn"><b>Check every number before a student sees this.</b></p>
<h1>Debrief</h1>
<p>Type 2–4 words. Example: landings good angles bad</p>
<textarea id="notes" rows="16"></textarea><br>
<button onclick="go()">Generate</button>
<button onclick="navigator.clipboard.writeText(document.getElementById('out').innerText)">Copy</button>
<div id="out"></div>
<script>
async function go() {
  const notes = document.getElementById("notes").value.trim();
  const out = document.getElementById("out");
  const empty = /^(air\s*work\s*complete|airwork complete)$/i.test(notes);
  if (!notes || empty) {
    out.innerText = "Add one real thing. Example: landings good / lookout weak";
    return;
  }
  const r = await fetch("/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ notes })
  });
  const d = await r.json();
  out.innerText = d.text || d.error || "No text";
  out.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
