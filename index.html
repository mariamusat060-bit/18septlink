<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 640px; }
    textarea { width: 100%; font-size: 16px; padding: 12px; box-sizing: border-box; }
    button { font-size: 18px; padding: 12px 16px; margin: 8px 8px 8px 0; }
    #out { font-size: 16px; line-height: 1.4; margin-top: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <p><b>Draft only. Instructor checks before the student sees it.</b></p>
  <h1>Debrief</h1>
  <p>What went well</p>
  <textarea id="well" rows="4"></textarea>
  <p>One thing to fix</p>
  <textarea id="fix" rows="4"></textarea>
  <p>What to review next</p>
  <textarea id="next" rows="4"></textarea><br>
  <button onclick="go()">Generate</button>
  <button onclick="navigator.clipboard.writeText(document.getElementById('out').innerText)">Copy</button>
  <div id="out"></div>
  <script>
    async function go() {
      const notes =
        "Went well: " + document.getElementById("well").value + "\n" +
        "Fix: " + document.getElementById("fix").value + "\n" +
        "Next: " + document.getElementById("next").value;
      const r = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ notes })
      });
      const d = await r.json();
      const out = document.getElementById("out");
      out.innerText = d.text;
      out.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
