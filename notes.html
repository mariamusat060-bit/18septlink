<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --sage: #6B8362;
    --sage-light: #9CAD8D;
    --parchment: #F0E6D2;
    --ink: #2B2B26;
    --muted: #7A7568;
    --border: #DCD4C0;
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 32px 24px;
    margin: 0 auto;
    max-width: 1100px;
    color: var(--ink);
    background: var(--parchment);
  }
  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px 0;
    color: var(--sage);
  }
  p.sub {
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 28px 0;
  }
  /* Desktop: input and output side by side, matching real feedback
     that the stacked layout wasted horizontal space on a laptop. */
  .columns {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .col { flex: 1; min-width: 0; }
  @media (max-width: 860px) {
    .columns { flex-direction: column; }
    body { max-width: 560px; }
  }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; margin-bottom: 12px; line-height: 1.5; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--muted); }
  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 6px 2px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 20px;
    border: none;
    border-radius: 14px;
    background: var(--sage);
    color: #fff;
    letter-spacing: -0.01em;
    cursor: pointer;
  }
  button.secondary {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--sage);
  }
  button:disabled { background: var(--sage-light); cursor: default; }
  button.full { width: 100%; margin-top: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  #status { font-size: 14px; color: var(--sage); margin-top: 10px; min-height: 18px; }
  #draftBox {
    display: none;
    margin-top: 20px;
  }
  #draftText {
    width: 100%;
    min-height: 340px;
    font-size: 15px;
    line-height: 1.6;
    padding: 18px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
    resize: vertical;
  }
  .refine-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .refine-row input { flex: 1; }
  .export-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  footer { font-size: 12px; color: var(--muted); margin-top: 40px; text-align: center; }
</style>
</head>
<body>
<h1>Folio</h1>
<p class="sub">Nothing gets left out.</p>

<div class="columns">
  <div class="col">
    <label class="field-label">Your notes</label>
    <textarea id="notes" rows="10" placeholder="Paste your notes here — works well up to about 30 pages at a time" autofocus></textarea>
    <label class="field-label">What to do with them (optional)</label>
    <input type="text" id="instructions" placeholder="e.g. keep everything, add 5 practice questions" />
    <button id="goBtn" class="full" onclick="go()">Generate draft</button>
    <div id="status"></div>
  </div>

  <div class="col" id="draftCol">
    <div id="draftBox">
      <label class="field-label">Your draft — edit it directly, or ask for a change below</label>
      <textarea id="draftText"></textarea>

      <div class="refine-row">
        <input type="text" id="refineInput" placeholder="e.g. make the memory section shorter" />
        <button class="secondary" onclick="refine()">Refine</button>
      </div>

      <div class="export-row">
        <select id="themeSelect">
          <option value="sage">Sage &amp; Parchment</option>
          <option value="bw">Black &amp; White</option>
        </select>
        <select id="fontSelect">
          <option value="normal">Normal text</option>
          <option value="large">Larger text</option>
        </select>
        <button onclick="exportAs('pdf')">Export PDF</button>
        <button class="secondary" onclick="exportAs('word')">Export Word</button>
      </div>
    </div>
  </div>
</div>

<footer>Built by Maria Mușat. &copy; 2026.</footer>

<script>
function sanitizeForRequest(text) {
  let clean = text.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, "");
  clean = clean.replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "");
  clean = clean.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
  return clean;
}

async function go() {
  const notes = sanitizeForRequest(document.getElementById("notes").value.trim());
  const instructions = sanitizeForRequest(document.getElementById("instructions").value.trim());
  const status = document.getElementById("status");
  const btn = document.getElementById("goBtn");
  const draftBox = document.getElementById("draftBox");

  status.innerText = "";

  if (!notes) {
    status.innerText = "Paste some notes first.";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Working...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, instructions, style: "tidy" })
    });
    const d = await r.json();

    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      return;
    }

    document.getElementById("draftText").value = d.text || "";
    draftBox.style.display = "block";
    status.innerText = d.warning ? d.warning : "Draft ready — edit it, or export when you're happy.";
    draftBox.scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
  } finally {
    btn.disabled = false;
    btn.innerText = "Generate draft";
  }
}

async function refine() {
  const draft = document.getElementById("draftText").value.trim();
  const instruction = sanitizeForRequest(document.getElementById("refineInput").value.trim());
  const status = document.getElementById("status");

  if (!draft) {
    status.innerText = "Generate a draft first.";
    return;
  }
  if (!instruction) {
    status.innerText = "Say what you want changed.";
    return;
  }

  status.innerText = "Refining...";

  try {
    const r = await fetch("/refine-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft, instruction })
    });
    const d = await r.json();

    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      return;
    }

    document.getElementById("draftText").value = d.text || draft;
    document.getElementById("refineInput").value = "";
    status.innerText = "Updated.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
  }
}

async function exportAs(format) {
  const text = document.getElementById("draftText").value.trim();
  const theme = document.getElementById("themeSelect").value;
  const fontSize = document.getElementById("fontSelect").value;
  const status = document.getElementById("status");

  if (!text) {
    status.innerText = "Nothing to export yet.";
    return;
  }

  status.innerText = "Preparing your file...";

  try {
    const r = await fetch("/export-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, format, theme, font_size: fontSize })
    });

    if (!r.ok) {
      const d = await r.json();
      status.innerText = d.error || "Could not create the file.";
      return;
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = format === "word" ? "folio.docx" : "folio.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.innerText = (format === "word" ? "Word file" : "PDF") + " downloaded.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
  }
}
</script>
</body>
</html>
