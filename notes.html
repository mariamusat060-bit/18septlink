<!DOCTYPE html>
<!--
  Tidy — built by Maria Mușat, 2026.
  Original concept, design, and prompt engineering by Maria Mușat.
-->
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --paper: #FAF8F4;
    --ink: #1F2430;
    --ink-muted: #5B6270;
    --teal: #2F6F73;
    --teal-light: #6B9C9F;
    --highlight: #EEF3C7;
    --before-text: #6E7280;
    --terracotta: #C0654A;
    --pdf-dot: #B0453A;
    --word-dot: #3A5FA0;
    --border: #E3DFD5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1B19;
      --ink: #F2EFE9;
      --ink-muted: #B8B3A8;
      --teal: #4A9498;
      --teal-light: #6B9C9F;
      --highlight: #3A3F2A;
      --before-text: #9C9890;
      --terracotta: #D97A5F;
      --border: #3A382F;
    }
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 48px 24px;
    margin: 0 auto;
    max-width: 1040px;
    color: var(--ink);
    background: var(--paper);
  }
  @media (min-width: 1200px) {
    body { padding-left: 48px; padding-right: 48px; }
  }
  .wordmark {
    font-family: "Fraunces", "Literata", serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 18px 0;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .wordmark .dot { color: var(--teal); }
  p.sub {
    font-family: "Fraunces", "Literata", serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 36px 0;
    text-align: center;
  }
  p.sub mark {
    background: var(--highlight);
    color: inherit;
    padding: 0 3px;
    border-radius: 3px;
  }
  .columns {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .col { flex: 1; min-width: 0; }
  @media (max-width: 860px) {
    .columns { flex-direction: column; }
    body { max-width: 560px; }
  }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
  }
  /* Notes box: paper, not a flat gray form field — a soft shadow and
     faint ruled lines, so pasting notes feels like putting them on a
     desk. Text stays a touch muted so it still reads as "raw", the
     way it did before, just expressed through tone rather than a
     dull gray box. */
  #notes {
    background: #fff;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent, transparent 26px,
      var(--border) 27px, transparent 28px
    );
    color: var(--before-text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.05);
  }
  @media (prefers-color-scheme: dark) {
    #notes { background: #242320; background-image: none; }
  }
  #notes:focus { color: var(--ink); }
  textarea { resize: vertical; margin-bottom: 4px; line-height: 27px; padding-top: 13px; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--ink-muted); font-style: italic; }
  .field-caption {
    font-size: 12px;
    color: var(--ink-muted);
    margin: 0 0 14px 2px;
  }
  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    margin: 0 0 6px 0;
  }
  .upload-row {
    margin: 0 0 16px 0;
  }
  .upload-link {
    font-size: 13px;
    color: var(--teal);
    text-decoration: underline;
    cursor: pointer;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 20px;
    border: none;
    border-radius: 14px;
    background: var(--teal);
    color: #fff;
    letter-spacing: -0.01em;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--teal);
  }
  button:disabled { background: var(--teal-light); cursor: default; }
  button.full { width: 100%; margin-top: 12px; }
  .hint-line {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin: 8px 0 0 0;
  }
  #status { font-size: 14px; color: var(--teal); margin-top: 10px; min-height: 18px; }
  #status.error { color: var(--terracotta); }
  #draftBox {
    margin-top: 20px;
    transition: opacity 0.2s ease;
  }
  #draftBox.disabled {
    opacity: 0.45;
    pointer-events: none;
  }
  #draftText {
    width: 100%;
    min-height: 340px;
    font-family: "Literata", Georgia, serif;
    font-size: 16px;
    line-height: 1.65;
    padding: 18px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
    resize: vertical;
    transition: background 0.6s ease;
  }
  @media (prefers-color-scheme: dark) {
    #draftText { background: #242320; }
  }
  #draftText.reveal {
    background: var(--highlight);
  }
  .refine-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .refine-row input { flex: 1; }
  .settings-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .export-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .export-buttons button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.pdf { background: var(--pdf-dot); }
  .dot.word { background: var(--word-dot); }
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    select { background: #242320; }
  }
  button.loading {
    background: var(--teal-light);
    cursor: default;
  }
</style>
</head>
<body>
<p class="wordmark">tidy<span class="dot">.</span></p>
<p class="sub">Nothing gets <mark>left out</mark>.</p>

<div class="columns">
  <div class="col">
    <label class="field-label">Your notes</label>
    <textarea id="notes" rows="10" placeholder="mtg w/ Sam &#8594; budget?? due fri" autofocus></textarea>
    <div class="field-caption">Works well up to about 30 pages at a time.</div>

    <div class="upload-row">
      <span class="upload-link" onclick="document.getElementById('fileInput').click()">or drop a file — PDF, Word, or a photo</span>
      <input type="file" id="fileInput" accept=".pdf,.docx,.png,.jpg,.jpeg" style="display:none" onchange="handleFile(this.files[0])" />
    </div>

    <label class="field-label">What to do with them (optional)</label>
    <input type="text" id="instructions" placeholder="e.g. keep everything, add 5 practice questions" />
    <button id="goBtn" class="full" onclick="go()">Tidy it.</button>
    <p class="hint-line">Editable draft &middot; Export to PDF or Word</p>
    <div id="status"></div>
  </div>

  <div class="col" id="draftCol">
    <div id="draftBox" class="disabled">
      <label class="field-label">Your draft — edit it directly, or ask for a change below</label>
      <textarea id="draftText" placeholder="Your draft will appear here once you generate it" disabled></textarea>

      <div class="refine-row">
        <input type="text" id="refineInput" placeholder="e.g. make the memory section shorter" disabled />
        <button class="secondary" id="refineBtn" onclick="refine()" disabled>Refine</button>
      </div>

      <div class="settings-row">
        <select id="themeSelect" disabled>
          <option value="paper">Paper &amp; Ink</option>
          <option value="bw">Black &amp; White</option>
        </select>
        <select id="fontSelect" disabled>
          <option value="normal">Normal text</option>
          <option value="large">Larger text</option>
        </select>
      </div>

      <div class="export-buttons">
        <button id="exportPdfBtn" onclick="exportAs('pdf')" disabled><span class="dot pdf"></span>Export PDF</button>
        <button class="secondary" id="exportWordBtn" onclick="exportAs('word')" disabled><span class="dot word"></span>Export Word</button>
      </div>
    </div>
  </div>

</div>

<script>
function sanitizeForRequest(text) {
  let clean = text.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, "");
  clean = clean.replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "");
  clean = clean.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
  return clean;
}

function enableDraftBox() {
  const draftBox = document.getElementById("draftBox");
  draftBox.classList.remove("disabled");
  document.getElementById("draftText").disabled = false;
  document.getElementById("refineInput").disabled = false;
  document.getElementById("refineBtn").disabled = false;
  document.getElementById("themeSelect").disabled = false;
  document.getElementById("fontSelect").disabled = false;
  document.getElementById("exportPdfBtn").disabled = false;
  document.getElementById("exportWordBtn").disabled = false;
}

function flashHighlight() {
  const draftText = document.getElementById("draftText");
  draftText.classList.add("reveal");
  setTimeout(() => draftText.classList.remove("reveal"), 900);
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFile(file) {
  if (!file) return;
  const status = document.getElementById("status");
  status.classList.remove("error");

  const ext = file.name.split(".").pop().toLowerCase();
  const allowed = ["pdf", "docx", "png", "jpg", "jpeg"];
  if (!allowed.includes(ext)) {
    status.innerText = "Use a PDF, Word file, or a photo (jpg/png).";
    status.classList.add("error");
    return;
  }

  status.innerText = ext === "pdf" || ext === "docx"
    ? "Reading your file..."
    : "Reading your photo...";

  try {
    const base64 = await fileToBase64(file);
    const r = await fetch("/extract-text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file_data: base64, file_type: ext, filename: file.name })
    });
    const d = await r.json();

    if (!r.ok) {
      status.innerText = d.error || "Could not read that file.";
      status.classList.add("error");
      return;
    }

    const notes = document.getElementById("notes");
    notes.value = notes.value.trim()
      ? notes.value.trim() + "\n\n" + d.text
      : d.text;
    status.innerText = "Added from " + file.name + ".";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  }
}

async function go() {
  const notes = sanitizeForRequest(document.getElementById("notes").value.trim());
  const instructions = sanitizeForRequest(document.getElementById("instructions").value.trim());
  const status = document.getElementById("status");
  const btn = document.getElementById("goBtn");

  status.innerText = "";
  status.classList.remove("error");

  if (!notes) {
    status.innerText = "Paste some notes first.";
    status.classList.add("error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Working...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, instructions, style: "tidy" })
    });
    const d = await r.json();

    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      status.classList.add("error");
      return;
    }

    document.getElementById("draftText").value = d.text || "";
    enableDraftBox();
    flashHighlight();
    status.innerText = d.warning ? d.warning : "Draft ready — edit it, or export when you're happy.";
    if (d.warning) status.classList.add("error");
    document.getElementById("draftBox").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.innerText = "Tidy it.";
  }
}

async function refine() {
  const draft = document.getElementById("draftText").value.trim();
  const instruction = sanitizeForRequest(document.getElementById("refineInput").value.trim());
  const status = document.getElementById("status");
  const refineBtn = document.getElementById("refineBtn");

  status.classList.remove("error");

  if (!draft) {
    status.innerText = "Generate a draft first.";
    status.classList.add("error");
    return;
  }
  if (!instruction) {
    status.innerText = "Say what you want changed.";
    status.classList.add("error");
    return;
  }

  refineBtn.disabled = true;
  refineBtn.classList.add("loading");
  refineBtn.innerText = "Refining...";
  status.innerText = "";

  try {
    const r = await fetch("/refine-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft, instruction })
    });
    const d = await r.json();

    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      status.classList.add("error");
      return;
    }

    document.getElementById("draftText").value = d.text || draft;
    document.getElementById("refineInput").value = "";
    flashHighlight();
    status.innerText = "Updated.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  } finally {
    refineBtn.disabled = false;
    refineBtn.classList.remove("loading");
    refineBtn.innerText = "Refine";
  }
}

async function exportAs(format) {
  const text = document.getElementById("draftText").value.trim();
  const theme = document.getElementById("themeSelect").value;
  const fontSize = document.getElementById("fontSelect").value;
  const status = document.getElementById("status");

  status.classList.remove("error");

  if (!text) {
    status.innerText = "Nothing to export yet.";
    status.classList.add("error");
    return;
  }

  status.innerText = "Preparing your file...";

  try {
    const r = await fetch("/export-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, format, theme, font_size: fontSize })
    });

    if (!r.ok) {
      const d = await r.json();
      status.innerText = d.error || "Could not create the file.";
      status.classList.add("error");
      return;
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = format === "word" ? "tidy.docx" : "tidy.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.innerText = (format === "word" ? "Word file" : "PDF") + " downloaded.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  }
}
</script>
</body>
</html>
