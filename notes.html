<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noteZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
    color: #173404;
    background: #FAF9F3;
  }
  h1 {
    font-family: "Quicksand", sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  p.sub {
    font-size: 13px;
    color: #5F5E5A;
    margin: 0 0 18px 0;
  }
  textarea, input[type=text] {
    width: 100%;
    font-size: 14px;
    padding: 10px 12px;
    border: 0.5px solid #C0DD97;
    border-radius: 12px;
    background: #fff;
    color: #173404;
  }
  textarea { resize: vertical; margin-bottom: 10px; }
  input[type=text]::placeholder, textarea::placeholder { color: #97A08A; }
  button {
    width: 100%;
    font-family: "Quicksand", sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 12px 0;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #173404;
    color: #fff;
  }
  button:disabled { background: #97A08A; }
  #status { font-size: 13px; color: #3B6D11; margin-top: 8px; }
  #status a { color: #3B6D11; }
  #out {
    font-size: 14px;
    line-height: 1.6;
    margin-top: 16px;
    padding: 14px;
    background: #EAF3DE;
    border-radius: 12px;
    white-space: pre-wrap;
    min-height: 24px;
  }
  #textLink { font-size: 12px; margin-top: 10px; display: none; }
  #textLink a { color: #5F5E5A; text-decoration: underline; cursor: pointer; }
  footer { font-size: 11px; color: #97A08A; margin-top: 30px; text-align: center; }
</style>
</head>
<body>
<h1>noteZ</h1>
<p class="sub">Paste your notes below. Tell it what to keep or add — nothing gets left out.</p>

<textarea id="notes" rows="8" placeholder="Paste your notes here" autofocus></textarea>
<input type="text" id="instructions" placeholder="e.g. keep everything, add 5 practice questions" />

<button id="goBtn" onclick="go()">Consolidate</button>
<div id="status"></div>
<div id="textLink"><a onclick="viewAsText()">View as text instead</a></div>
<div id="out"></div>

<footer>Built by Maria Mușat. &copy; 2026.</footer>

<script>
let lastNotes = "";
let lastInstructions = "";

async function go() {
  const notes = document.getElementById("notes").value.trim();
  const instructions = document.getElementById("instructions").value.trim();
  const out = document.getElementById("out");
  const status = document.getElementById("status");
  const textLink = document.getElementById("textLink");
  const btn = document.getElementById("goBtn");

  status.innerText = "";
  out.innerText = "";
  textLink.style.display = "none";

  if (!notes) {
    out.innerText = "Paste some notes first.";
    return;
  }

  lastNotes = notes;
  lastInstructions = instructions;

  btn.disabled = true;
  btn.innerText = "Consolidating...";

  try {
    // PDF is the default output — she said this is what she actually
    // wants for revision. Text is available as a secondary option
    // after generating, not a decision she has to make up front.
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, instructions, format: "pdf" })
    });

    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const opened = window.open(url, "_blank");
      if (!opened) {
        status.innerText = "Pop-up blocked — tap the link below to open the PDF.";
        out.innerHTML = '<a href="' + url + '" target="_blank">Open your PDF</a>';
      } else {
        status.innerText = "PDF opened in a new tab.";
      }
      const warning = r.headers.get("X-Completeness-Warning");
      if (warning) status.innerText += " " + warning;
      textLink.style.display = "block";
    } else {
      const d = await r.json();
      out.innerText = d.error || "Something went wrong.";
    }
  } catch (e) {
    out.innerText = "Could not reach the server. Try again.";
  } finally {
    btn.disabled = false;
    btn.innerText = "Consolidate";
  }
}

async function viewAsText() {
  const out = document.getElementById("out");
  const status = document.getElementById("status");
  status.innerText = "Loading text...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes: lastNotes, instructions: lastInstructions, format: "text" })
    });
    const d = await r.json();
    out.innerText = d.text || d.error || "No text";
    out.scrollIntoView({ behavior: "smooth" });

    if (d.text) {
      try {
        await navigator.clipboard.writeText(d.text);
        status.innerText = d.warning ? d.warning + " (copied)" : "Copied.";
      } catch (e) {
        status.innerText = d.warning ? d.warning : "";
      }
    }
  } catch (e) {
    out.innerText = "Could not reach the server. Try again.";
  }
}
</script>
</body>
</html>
