<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --sage: #4F6F52;
    --sage-light: #7C9473;
    --parchment: #F7F2E7;
    --ink: #2B2B26;
    --muted: #7A7568;
    --border: #DCD4C0;
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 32px 24px;
    max-width: 520px;
    margin: 0 auto;
    color: var(--ink);
    background: var(--parchment);
  }
  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px 0;
    color: var(--sage);
  }
  p.sub {
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 32px 0;
  }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
  }
  textarea { resize: vertical; margin-bottom: 12px; line-height: 1.5; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--muted); }
  button {
    width: 100%;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 0;
    margin-top: 16px;
    border: none;
    border-radius: 14px;
    background: var(--sage);
    color: #fff;
    letter-spacing: -0.01em;
  }
  button:disabled { background: var(--sage-light); }
  #status { font-size: 14px; color: var(--sage); margin-top: 10px; }
  #status a { color: var(--sage); }
  #out {
    font-size: 15px;
    line-height: 1.65;
    margin-top: 20px;
    padding: 18px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    white-space: pre-wrap;
    min-height: 24px;
  }
  #textLink { font-size: 13px; margin-top: 14px; display: none; }
  #textLink a { color: var(--muted); text-decoration: underline; cursor: pointer; }
  footer { font-size: 12px; color: var(--muted); margin-top: 40px; text-align: center; }
</style>
</head>
<body>
<h1>Folio</h1>
<p class="sub">Nothing gets left out.</p>

<textarea id="notes" rows="8" placeholder="Paste your notes here" autofocus></textarea>
<input type="text" id="instructions" placeholder="e.g. keep everything, add 5 practice questions" />

<button id="goBtn" onclick="go()">Folio</button>
<div id="status"></div>
<div id="textLink"><a onclick="viewAsText()">View as text</a></div>
<div id="out"></div>

<footer>Built by Maria Mușat. &copy; 2026.</footer>

<script>
let lastNotes = "";
let lastInstructions = "";

function sanitizeForRequest(text) {
  let clean = text.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, "");
  clean = clean.replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "");
  clean = clean.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
  return clean;
}

async function go() {
  const notes = sanitizeForRequest(document.getElementById("notes").value.trim());
  const instructions = sanitizeForRequest(document.getElementById("instructions").value.trim());
  const out = document.getElementById("out");
  const status = document.getElementById("status");
  const textLink = document.getElementById("textLink");
  const btn = document.getElementById("goBtn");

  status.innerText = "";
  out.innerText = "";
  textLink.style.display = "none";

  if (!notes) {
    out.innerText = "Paste some notes first.";
    return;
  }

  lastNotes = notes;
  lastInstructions = instructions;

  btn.disabled = true;
  btn.innerText = "Working...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, instructions, format: "pdf" })
    });

    if (r.ok) {
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const opened = window.open(url, "_blank");
      if (!opened) {
        status.innerText = "Pop-up blocked — tap the link below to open the PDF.";
        out.innerHTML = '<a href="' + url + '" target="_blank">Open your PDF</a>';
      } else {
        status.innerText = "PDF opened in a new tab.";
      }
      const warning = r.headers.get("X-Completeness-Warning");
      if (warning) status.innerText += " " + warning;
      textLink.style.display = "block";
    } else {
      const d = await r.json();
      out.innerText = d.error || "Something went wrong.";
    }
  } catch (e) {
    out.innerText = "Could not reach the server. Try again.";
  } finally {
    btn.disabled = false;
    btn.innerText = "Folio";
  }
}

async function viewAsText() {
  const out = document.getElementById("out");
  const status = document.getElementById("status");
  status.innerText = "Loading text...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes: lastNotes, instructions: lastInstructions, format: "text" })
    });
    const d = await r.json();
    out.innerText = d.text || d.error || "No text";
    out.scrollIntoView({ behavior: "smooth" });

    if (d.text) {
      try {
        await navigator.clipboard.writeText(d.text);
        status.innerText = d.warning ? d.warning + " (copied)" : "Copied.";
      } catch (e) {
        status.innerText = d.warning ? d.warning : "";
      }
    }
  } catch (e) {
    out.innerText = "Could not reach the server. Try again.";
  }
}
</script>
</body>
</html>
