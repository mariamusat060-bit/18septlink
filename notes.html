<!DOCTYPE html>
<!--
  Tidy — built by Maria Mușat, 2026.
  Original concept, design, and prompt engineering by Maria Mușat.
-->
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Literata:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --paper: #FAF8F4;
    --ink: #1F2430;
    --ink-muted: #5B6270;
    --teal: #2F6F73;
    --teal-light: #6B9C9F;
    --teal-glow: rgba(47,111,115,0.25);
    --highlight: #EEF3C7;
    --before-text: #6E7280;
    --terracotta: #C0654A;
    --pdf-dot: #B0453A;
    --word-dot: #3A5FA0;
    --border: #E3DFD5;
    --ghost: #EDEAE3;
    --ghost-strong: #E3DFD5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1B19;
      --ink: #F2EFE9;
      --ink-muted: #B8B3A8;
      --teal: #4A9498;
      --teal-light: #6B9C9F;
      --highlight: #3A3F2A;
      --before-text: #9C9890;
      --terracotta: #D97A5F;
      --border: #3A382F;
      --ghost: #2A2925;
      --ghost-strong: #333129;
    }
  }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 48px 24px;
    margin: 0 auto;
    max-width: 1040px;
    color: var(--ink);
    background: var(--paper);
  }
  @media (min-width: 1200px) {
    body { padding-left: 48px; padding-right: 48px; }
  }
  .wordmark {
    font-family: "Fraunces", "Literata", serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 18px 0;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .wordmark .dot { color: var(--teal); }
  p.sub {
    font-family: "Fraunces", "Literata", serif;
    font-weight: 500;
    font-size: 22px;
    color: var(--ink);
    margin: 0 0 36px 0;
    text-align: center;
  }
  p.sub mark {
    background: var(--highlight);
    color: inherit;
    padding: 0 2px;
    border-radius: 3px;
  }
  .columns {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .col { flex: 1; min-width: 0; }
  @media (max-width: 860px) {
    .columns { flex-direction: column; }
    body { max-width: 560px; }
  }
  textarea, input[type=text] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
    outline: none;
  }
  textarea:focus, input[type=text]:focus, select:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px var(--teal-glow);
  }

  /* Notes box: ruled paper, with a paperclip and mic tucked inside the
     box, and a drop highlight when a file is dragged over it. */
  .notes-wrap { position: relative; }
  #notes {
    background: #fff;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent, transparent 26px,
      var(--border) 27px, transparent 28px
    );
    color: var(--before-text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 16px rgba(0,0,0,0.05);
    padding-bottom: 48px;
    margin-bottom: 0;
  }
  @media (prefers-color-scheme: dark) {
    #notes { background: #242320; background-image: none; }
  }
  #notes:focus { color: var(--ink); }
  .notes-wrap.dragover #notes {
    border: 1.5px dashed var(--teal);
    box-shadow: 0 0 0 3px var(--teal-glow);
  }
  .drop-hint {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: rgba(250,248,244,0.82);
    color: var(--teal);
    font-weight: 600;
    font-size: 15px;
    pointer-events: none;
  }
  @media (prefers-color-scheme: dark) {
    .drop-hint { background: rgba(28,27,25,0.82); }
  }
  .notes-wrap.dragover .drop-hint { display: flex; }
  .box-tools {
    position: absolute;
    right: 10px;
    bottom: 10px;
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink-muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .icon-btn { background: #242320; } }
  .icon-btn:hover { color: var(--teal); border-color: var(--teal); }
  .icon-btn.on {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }
  .icon-btn svg { width: 17px; height: 17px; }

  textarea { resize: vertical; line-height: 27px; padding-top: 13px; }
  input[type=text]::placeholder, textarea::placeholder { color: var(--ink-muted); font-style: italic; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--ink-muted);
    margin: 6px 2px 0 2px;
    min-height: 16px;
  }
  .meta-row .over { color: var(--terracotta); font-weight: 500; }
  .field-caption {
    font-size: 12px;
    color: var(--ink-muted);
    margin: 4px 0 16px 2px;
  }
  .mini-select {
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }
  .upload-link {
    color: var(--teal);
    text-decoration: underline;
    cursor: pointer;
    font-style: normal;
  }
  label.field-label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-muted);
    margin: 0 0 6px 0;
  }
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px 0;
  }
  .chip {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink-muted);
    cursor: pointer;
    letter-spacing: 0;
  }
  @media (prefers-color-scheme: dark) { .chip { background: #242320; } }
  .chip.selected {
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
  }
  .chip.selected::before { content: "\2713\00a0"; }
  .chip.quiet { background: transparent; border-style: dashed; }
  #customInstructionRow { display: none; margin: -6px 0 16px 0; }
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px 20px;
    border: none;
    border-radius: 14px;
    background: var(--teal);
    color: #fff;
    letter-spacing: -0.01em;
    cursor: pointer;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--teal);
  }
  button:disabled { background: var(--teal-light); cursor: default; }
  button.full { width: 100%; margin-top: 12px; }
  .hint-line {
    font-size: 12px;
    color: var(--ink-muted);
    text-align: center;
    margin: 8px 0 0 0;
  }
  #status, #draftStatus { font-size: 14px; color: var(--teal); margin-top: 10px; min-height: 18px; }
  #status.error, #draftStatus.error { color: var(--terracotta); }

  #ghostSheet {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    min-height: 340px;
  }
  @media (prefers-color-scheme: dark) { #ghostSheet { background: #242320; } }
  .ghost-line { height: 10px; background: var(--ghost); border-radius: 4px; margin-bottom: 12px; }
  .ghost-line.heading { height: 16px; width: 42%; background: var(--ghost-strong); margin-bottom: 20px; }
  .ghost-line.w1 { width: 94%; }
  .ghost-line.w2 { width: 86%; }
  .ghost-line.w3 { width: 68%; }
  .ghost-line.w4 { width: 91%; }
  .ghost-line.w5 { width: 55%; margin-bottom: 0; }

  #draftText {
    display: none;
    width: 100%;
    min-height: 340px;
    font-family: "Literata", Georgia, serif;
    font-size: 16px;
    line-height: 1.65;
    padding: 18px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--ink);
    resize: vertical;
    transition: background 0.6s ease;
  }
  @media (prefers-color-scheme: dark) { #draftText { background: #242320; } }
  #draftText.reveal { background: var(--highlight); }
  #refineSection { display: none; margin-top: 10px; }
  .refine-row { display: flex; gap: 10px; }
  .refine-row input { flex: 1; }
  .settings-row {
    display: flex;
    gap: 18px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .setting-group { display: flex; flex-direction: column; gap: 4px; }
  .setting-group label { font-size: 11px; color: var(--ink-muted); font-weight: 500; }
  .export-buttons { display: flex; gap: 10px; margin-top: 16px; }
  .export-buttons button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .export-buttons button:disabled {
    background: var(--ghost);
    color: var(--ink-muted);
    border: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.pdf { background: var(--pdf-dot); }
  .dot.word { background: var(--word-dot); }
  select {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  @media (prefers-color-scheme: dark) { select { background: #242320; } }
  button.loading { background: var(--teal-light); cursor: default; }
</style>
</head>
<body>
<p class="wordmark">tidy<span class="dot">.</span></p>
<p class="sub">Nothing gets <mark>left out</mark>.</p>

<div class="columns">
  <div class="col">
    <label class="field-label">Your notes</label>
    <div class="notes-wrap" id="notesWrap">
      <textarea id="notes" rows="10" autocomplete="off" placeholder="mtg w/ Sam &#8594; budget?? due fri&#10;call mum, book dentist!!&#10;ch.4 supply &amp; demand, elasticity (ask Dr K?)" autofocus></textarea>
      <div class="drop-hint">Drop a file to add it</div>
      <div class="box-tools">
        <button type="button" class="icon-btn" id="micBtn" title="Speak your notes" aria-label="Speak your notes" onclick="toggleVoice()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
        </button>
        <button type="button" class="icon-btn" title="Add a file or a photo" aria-label="Add a file or a photo" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
        </button>
      </div>
    </div>
    <div class="meta-row">
      <span id="counter">0 words</span>
      <span id="saveNote"></span>
    </div>
    <p class="field-caption">
      <span class="upload-link" onclick="document.getElementById('fileInput').click()">Drop a file (PDF, Word, or a photo of handwritten notes)</span>
    </p>
    <p class="field-caption" id="micLangRow" style="margin-top:-8px;">
      Speak in
      <select id="micLang" class="mini-select" onchange="saveMicLang()">
        <option value="">my device's language</option>
        <option value="en-AU">English (Australia)</option>
        <option value="en-US">English (US)</option>
        <option value="en-GB">English (UK)</option>
        <option value="ro-RO">Română</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
        <option value="it-IT">Italiano</option>
        <option value="pt-BR">Português</option>
        <option value="ja-JP">日本語</option>
        <option value="zh-CN">中文</option>
      </select>
    </p>
    <input type="file" id="fileInput" accept=".pdf,.docx,.png,.jpg,.jpeg" style="display:none" onchange="handleFile(this.files[0]); this.value='';" />

    <label class="field-label">What to do with them</label>
    <div class="chip-row" id="chipRow">
      <button type="button" class="chip selected" data-key="keep" aria-pressed="true" onclick="toggleChip('keep', this)">Keep everything</button>
      <button type="button" class="chip" data-key="shorter" aria-pressed="false" onclick="toggleChip('shorter', this)">Shorter</button>
      <button type="button" class="chip" data-key="action" aria-pressed="false" onclick="toggleChip('action', this)">Action items</button>
      <button type="button" class="chip" data-key="practice" aria-pressed="false" onclick="toggleChip('practice', this)">Practice questions</button>
      <button type="button" class="chip" data-key="cards" aria-pressed="false" onclick="toggleChip('cards', this)">Flashcards</button>
      <button type="button" class="chip" data-key="email" aria-pressed="false" onclick="toggleChip('email', this)">Email draft</button>
      <button type="button" class="chip quiet" onclick="toggleChip('custom', this)">+ something else</button>
    </div>
    <div id="customInstructionRow">
      <input type="text" id="customInstruction" placeholder="say what you want" />
    </div>

    <button id="goBtn" class="full" onclick="go()">Tidy it.</button>
    <p class="hint-line">Editable draft &middot; Export to PDF or Word</p>
    <p class="hint-line">Powered by Claude. Tidy keeps your notes only on your device.</p>
    <div id="status"></div>
  </div>

  <div class="col" id="draftCol">
    <label class="field-label">Your draft</label>

    <div id="ghostSheet">
      <div class="ghost-line heading"></div>
      <div class="ghost-line w1"></div>
      <div class="ghost-line w2"></div>
      <div class="ghost-line w3"></div>
      <div class="ghost-line heading" style="margin-top:20px;"></div>
      <div class="ghost-line w4"></div>
      <div class="ghost-line w5"></div>
    </div>

    <textarea id="draftText" autocomplete="off" placeholder="Your draft will appear here once you generate it"></textarea>

    <div id="refineSection">
      <div class="refine-row">
        <input type="text" id="refineInput" placeholder="e.g. make the memory section shorter" />
        <button class="secondary" id="refineBtn" onclick="refine()">Refine</button>
      </div>
    </div>

    <div class="settings-row">
      <div class="setting-group">
        <label>Style</label>
        <select id="themeSelect" disabled>
          <option value="paper">Paper &amp; Ink</option>
          <option value="bw">Black &amp; White</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Size</label>
        <select id="fontSelect" disabled>
          <option value="normal">Normal</option>
          <option value="large">Larger</option>
        </select>
      </div>
    </div>

    <div class="export-buttons">
      <button id="exportPdfBtn" onclick="exportAs('pdf')" disabled><span class="dot pdf"></span>Export PDF</button>
      <button class="secondary" id="exportWordBtn" onclick="exportAs('word')" disabled><span class="dot word"></span>Export Word</button>
    </div>
    <div id="draftStatus"></div>
  </div>

</div>

<script>
const MAX_CHARS = 120000;
const KEY_NOTES = "tidy.notes";
const KEY_DRAFT = "tidy.draft";

/* ---------- small helpers ---------- */
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function sanitizeForRequest(text) {
  let clean = text.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g, "");
  clean = clean.replace(/(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, "");
  clean = clean.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, "");
  return clean;
}

function suggestFilename(text) {
  // Name the file after the first heading or line, never after the app.
  const first = text.split("\n").map((s) => s.trim()).find((s) => s) || "";
  const name = first
    .replace(/:$/, "")
    .replace(/[^\p{L}\p{N}]+/gu, "_")
    .replace(/^_+|_+$/g, "")
    .slice(0, 50);
  return name || "notes";
}

/* ---------- word / page counter ---------- */
function updateCounter() {
  const t = document.getElementById("notes").value;
  const words = (t.trim().match(/\S+/g) || []).length;
  const el = document.getElementById("counter");
  if (t.length > MAX_CHARS) {
    el.innerHTML = '<span class="over">' + words.toLocaleString() +
      " words · over the limit, split it into two</span>";
    return;
  }
  if (words === 0) { el.textContent = "0 words"; return; }
  const pages = Math.max(1, Math.round(t.length / 3000));
  let text = words.toLocaleString() + " words · ~" + pages + (pages === 1 ? " page" : " pages");
  if (words > 3000) text += " · tidying takes a few minutes";
  el.textContent = text;
}

/* ---------- autosave on this device ---------- */
let saveTimer = null;
function showSaved() {
  const el = document.getElementById("saveNote");
  el.innerHTML = 'Saved on this device · <span class="upload-link" onclick="clearSaved()">Clear</span>';
}
function saveNotesSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const v = document.getElementById("notes").value;
    if (v.trim()) { lsSet(KEY_NOTES, v); showSaved(); } else { lsDel(KEY_NOTES); document.getElementById("saveNote").textContent = ""; }
  }, 600);
}
function saveDraft() {
  const v = document.getElementById("draftText").value;
  if (v.trim()) { lsSet(KEY_DRAFT, v); showSaved(); }
}
function onNotesChanged() { updateCounter(); saveNotesSoon(); }

function hideDraft() {
  document.getElementById("ghostSheet").style.display = "block";
  const d = document.getElementById("draftText");
  d.style.display = "none"; d.value = "";
  document.getElementById("refineSection").style.display = "none";
  ["themeSelect", "fontSelect", "exportPdfBtn", "exportWordBtn"].forEach((id) => {
    document.getElementById(id).disabled = true;
  });
}
function clearSaved() {
  lsDel(KEY_NOTES); lsDel(KEY_DRAFT);
  document.getElementById("notes").value = "";
  hideDraft();
  updateCounter();
  document.getElementById("saveNote").textContent = "";
  document.getElementById("status").textContent = "";
  document.getElementById("draftStatus").textContent = "";
}

/* ---------- chips ---------- */
const chipInstructions = {
  keep: "keep everything",
  shorter: "make it shorter",
  action: "pull out action items",
  practice: "add 5 practice questions",
  cards: "turn it into flashcards, each written as Q: question and A: answer",
  email: "write it as a clear email draft",
};
// Options that can't sensibly be combined switch each other off.
const conflicts = {
  keep: ["shorter", "email", "cards"],
  shorter: ["keep"],
  email: ["keep", "cards"],
  cards: ["keep", "email"],
};
let selectedChips = new Set(["keep"]);

function setChip(key, on) {
  const el = document.querySelector('.chip[data-key="' + key + '"]');
  if (!el) return;
  el.classList.toggle("selected", on);
  el.setAttribute("aria-pressed", on ? "true" : "false");
  if (on) selectedChips.add(key); else selectedChips.delete(key);
}
function toggleChip(key) {
  if (key === "custom") {
    const row = document.getElementById("customInstructionRow");
    const open = row.style.display === "block";
    row.style.display = open ? "none" : "block";
    if (!open) document.getElementById("customInstruction").focus();
    return;
  }
  const turningOn = !selectedChips.has(key);
  setChip(key, turningOn);
  if (turningOn) (conflicts[key] || []).forEach((k) => setChip(k, false));
}
function buildInstructions() {
  const parts = [...selectedChips].map((k) => chipInstructions[k]);
  const custom = document.getElementById("customInstruction").value.trim();
  if (custom) parts.push(custom);
  return parts.join(", ");
}

/* ---------- draft display ---------- */
function showDraft() {
  document.getElementById("ghostSheet").style.display = "none";
  document.getElementById("draftText").style.display = "block";
  document.getElementById("refineSection").style.display = "block";
  ["themeSelect", "fontSelect", "exportPdfBtn", "exportWordBtn"].forEach((id) => {
    document.getElementById(id).disabled = false;
  });
}
function flashHighlight() {
  const d = document.getElementById("draftText");
  d.classList.add("reveal");
  setTimeout(() => d.classList.remove("reveal"), 900);
}

/* ---------- files: click to pick, or drag onto the notes box ---------- */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFile(file) {
  if (!file) return;
  const status = document.getElementById("status");
  status.classList.remove("error");

  const ext = file.name.split(".").pop().toLowerCase();
  if (!["pdf", "docx", "png", "jpg", "jpeg"].includes(ext)) {
    status.innerText = "Use a PDF, Word file, or a photo (jpg/png).";
    status.classList.add("error");
    return;
  }
  status.innerText = (ext === "pdf" || ext === "docx") ? "Reading your file..." : "Reading your photo...";

  try {
    const base64 = await fileToBase64(file);
    const r = await fetch("/extract-text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file_data: base64, file_type: ext, filename: file.name })
    });
    const d = await r.json();
    if (!r.ok) {
      status.innerText = d.error || "Could not read that file.";
      status.classList.add("error");
      return;
    }
    const notes = document.getElementById("notes");
    notes.value = notes.value.trim() ? notes.value.trim() + "\n\n" + d.text : d.text;
    onNotesChanged();
    status.innerText = "Added from " + file.name + ".";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  }
}

(function setupDrop() {
  const wrap = document.getElementById("notesWrap");
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  ["dragenter", "dragover"].forEach((ev) => wrap.addEventListener(ev, (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    wrap.classList.add("dragover");
  }));
  wrap.addEventListener("dragleave", (e) => {
    if (!wrap.contains(e.relatedTarget)) wrap.classList.remove("dragover");
  });
  wrap.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    wrap.classList.remove("dragover");
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
})();

/* ---------- voice: speak your notes ---------- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

function setMicUI(on) {
  listening = on;
  document.getElementById("micBtn").classList.toggle("on", on);
  document.getElementById("micBtn").title = on ? "Stop" : "Speak your notes";
}
function toggleVoice() {
  const status = document.getElementById("status");
  if (!SpeechRec) return;
  if (listening) { recognizer.stop(); return; }
  recognizer = new SpeechRec();
  recognizer.continuous = true;
  recognizer.interimResults = false;
  recognizer.lang = document.getElementById("micLang").value || navigator.language || "en-US";
  recognizer.onresult = (e) => {
    const notes = document.getElementById("notes");
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const piece = e.results[i][0].transcript.trim();
        if (!piece) continue;
        notes.value += (notes.value && !/\s$/.test(notes.value) ? " " : "") + piece;
      }
    }
    onNotesChanged();
  };
  recognizer.onerror = (e) => {
    status.classList.add("error");
    status.innerText = e.error === "not-allowed"
      ? "Microphone access is blocked. Allow it in your browser settings."
      : "Couldn't hear that. Try again.";
  };
  recognizer.onend = () => setMicUI(false);
  status.classList.remove("error");
  status.innerText = "Listening...";
  recognizer.start();
  setMicUI(true);
}
if (!SpeechRec) {
  document.getElementById("micBtn").style.display = "none";
  document.getElementById("micLangRow").style.display = "none";
}
function saveMicLang() { lsSet("tidy.micLang", document.getElementById("micLang").value); }
(function restoreMicLang() {
  const v = lsGet("tidy.micLang");
  if (v) document.getElementById("micLang").value = v;
})();

/* ---------- generate / refine / export ---------- */
async function go() {
  const notes = sanitizeForRequest(document.getElementById("notes").value.trim());
  const instructions = sanitizeForRequest(buildInstructions());
  const status = document.getElementById("status");
  const btn = document.getElementById("goBtn");

  status.innerText = "";
  status.classList.remove("error");

  if (!notes) {
    status.innerText = "Paste some notes first.";
    status.classList.add("error");
    return;
  }
  if (notes.length > MAX_CHARS) {
    status.innerText = "That's over the limit. Split it into two and tidy each part.";
    status.classList.add("error");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Working...";

  try {
    const r = await fetch("/generate-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ notes, instructions, style: "tidy" })
    });
    const d = await r.json();
    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      status.classList.add("error");
      return;
    }
    document.getElementById("draftText").value = d.text || "";
    showDraft();
    flashHighlight();
    saveDraft();
    status.innerText = d.warning ? d.warning : "Draft ready — edit it, or export when you're happy.";
    if (d.warning) status.classList.add("error");
    document.getElementById("draftText").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  } finally {
    btn.disabled = false;
    btn.innerText = "Tidy it.";
  }
}

async function refine() {
  const draft = document.getElementById("draftText").value.trim();
  const instruction = sanitizeForRequest(document.getElementById("refineInput").value.trim());
  const status = document.getElementById("draftStatus");
  const refineBtn = document.getElementById("refineBtn");

  status.classList.remove("error");
  if (!draft) {
    status.innerText = "Generate a draft first.";
    status.classList.add("error");
    return;
  }
  if (!instruction) {
    status.innerText = "Say what you want changed.";
    status.classList.add("error");
    return;
  }

  refineBtn.disabled = true;
  refineBtn.classList.add("loading");
  refineBtn.innerText = "Refining...";
  status.innerText = "";

  try {
    const r = await fetch("/refine-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ draft, instruction })
    });
    const d = await r.json();
    if (!r.ok) {
      status.innerText = d.error || "Something went wrong.";
      status.classList.add("error");
      return;
    }
    document.getElementById("draftText").value = d.text || draft;
    document.getElementById("refineInput").value = "";
    flashHighlight();
    saveDraft();
    status.innerText = "Updated.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  } finally {
    refineBtn.disabled = false;
    refineBtn.classList.remove("loading");
    refineBtn.innerText = "Refine";
  }
}

async function exportAs(format) {
  const text = document.getElementById("draftText").value.trim();
  const theme = document.getElementById("themeSelect").value;
  const fontSize = document.getElementById("fontSelect").value;
  const status = document.getElementById("draftStatus");

  status.classList.remove("error");
  if (!text) {
    status.innerText = "Nothing to export yet.";
    status.classList.add("error");
    return;
  }
  const suggested = suggestFilename(text) + (format === "word" ? ".docx" : ".pdf");

  // Where the browser supports it (desktop Chrome and Edge), let the person
  // pick the folder and file name. It is asked first, right after the tap,
  // because browsers only allow this dialog straight after a click.
  let handle = null;
  if (window.showSaveFilePicker) {
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [format === "word"
          ? { description: "Word document", accept: { "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [".docx"] } }
          : { description: "PDF", accept: { "application/pdf": [".pdf"] } }],
      });
    } catch (e) {
      if (e && e.name === "AbortError") { status.innerText = ""; return; }
      handle = null;
    }
  }

  status.innerText = "Preparing your file...";

  try {
    const r = await fetch("/export-notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, format, theme, font_size: fontSize })
    });
    if (!r.ok) {
      const d = await r.json();
      status.innerText = d.error || "Could not create the file.";
      status.classList.add("error");
      return;
    }
    const blob = await r.blob();

    let saved = false;
    if (handle) {
      try {
        const w = await handle.createWritable();
        await w.write(blob);
        await w.close();
        saved = true;
      } catch (e) { saved = false; }
    }
    if (!saved) {
      // Other browsers: a normal download, named after the first heading.
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = suggested;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    status.innerText = saved
      ? "Saved as " + handle.name + "."
      : (format === "word" ? "Word file" : "PDF") + " downloaded.";
  } catch (e) {
    status.innerText = "Could not reach the server. Try again.";
    status.classList.add("error");
  }
}

/* ---------- start-up: restore what was saved on this device ---------- */
document.getElementById("notes").addEventListener("input", onNotesChanged);
document.getElementById("draftText").addEventListener("input", () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 600);
});
(function restore() {
  const n = lsGet(KEY_NOTES);
  const d = lsGet(KEY_DRAFT);
  if (n) document.getElementById("notes").value = n;
  if (d) { document.getElementById("draftText").value = d; showDraft(); }
  updateCounter();
  if (n || d) showSaved();
})();
</script>
